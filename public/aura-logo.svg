<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" width="240" height="64">
  <defs>
    <!-- Mild Sandal (Sandalwood / Warm Ivory) mixed gradient -->
    <linearGradient id="sandalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#FCF8F2" />
      <stop offset="100%" stop-color="#F3EAD8" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBE2D3" />
      <stop offset="100%" stop-color="#DDD1BD" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#7B6D58" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Logo Mark Container (White with mild sandal mixed background) -->
  <g filter="url(#subtleShadow)">
    <rect x="6" y="8" width="48" height="48" rx="12" fill="url(#sandalGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />
    
    <!-- Bold Minimalist Monogram / Symbol in Pure Black -->
    <path d="M30 18 L39 38 L34.5 38 L32.5 33 L27.5 33 L25.5 38 L21 38 Z M29 24.5 L28.2 29.5 L31.8 29.5 Z" fill="#000000" />
    <!-- Luxury dot accent -->
    <circle cx="30" cy="41" r="1.8" fill="#000000" />
  </g>

  <!-- Wordmark "AURA" in bold black typography -->
  <text x="68" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'SF Pro Display', sans-serif" font-size="28" font-weight="900" letter-spacing="4" fill="#000000">AURA</text>

  <!-- Subtitle badge: VIBE CODING -->
  <text x="69" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif" font-size="8.5" font-weight="700" letter-spacing="2.5" fill="#888075">AI APP STUDIO</text>
</svg>
